services:
  api:
    build:
      context: .
      target: api
    environment:
      CNK_ADMIN_PASSWORD: ${CNK_ADMIN_PASSWORD:?Set CNK_ADMIN_PASSWORD in .env}
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app/api
      - cnk_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VUE_APP_API_BASE_URL: http://localhost:3001/api
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  cnk_data:
  frontend_node_modules:
